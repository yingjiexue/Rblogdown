# 评论区（utterances）：文章 front matter 中写 comments: true 才显示评论，
# 不写或 comments: false 则不显示；enable 为全站总开关。
[params.utterances]
  enable = true
  repo = "yingjiexue/comments"   # 存放评论 Issue 的 GitHub 仓库（需安装 utterances 应用并开启 Issues）
  issue_term = "pathname"        # 页面映射到 Issue 的方式：pathname / url / title / og:title
  label = "blog-comments"        # 评论 Issue 使用的标签（标签需已在仓库中创建）
  theme = "github-light"         # 评论区主题

  
    
[params]
    description = ""
    footer="&copy; [Yingjie Xue](/)2020| [Github](https://github.com/yingjiexue)"
    # options for highlight.js (version, additional languages, and theme)
    highlightjsVersion = "11.9.0"
    highlightjsCDN = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0"
    highlightjsLang = ["r", "yaml"]
    highlightjsTheme = "github"



    
[params.math]
    enable = true
    use = "mathjax"
 

[params.logo]
    url = "logo.png"
    width = 50
    height = 50
    alt = "Public"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


