{{ $utterances := .Site.Params.utterances }}
{{ if and $utterances.repo $utterances.issue_term }}
<section id="comments">
  <script src="https://utteranc.es/client.js"
          repo="{{ $utterances.repo }}"
          issue-term="{{ $utterances.issue_term }}"
          {{ with $utterances.label }}label="{{ . }}"{{ end }}
          {{ with $utterances.theme }}theme="{{ . }}"{{ end }}
          crossorigin="anonymous"
          async>
  </script>
</section>
{{ end }}
